<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>CronWatch Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
    }
    .topbar {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .topbar-logo { font-size: 20px; font-weight: 800; color: #10b981; }
    .topbar-sub { font-size: 13px; color: #6b7280; }
    .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }
    h2 { font-size: 20px; font-weight: 700; color: #f0f0f0; margin-bottom: 16px; }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .monitor-table { width: 100%; border-collapse: collapse; }
    .monitor-table th {
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: #6b7280;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 12px 12px 0;
      border-bottom: 1px solid #1f2937;
    }
    .monitor-table td {
      padding: 14px 12px 14px 0;
      font-size: 14px;
      color: #d1d5db;
      border-bottom: 1px solid #1f2937;
      vertical-align: top;
    }
    .monitor-table tr:last-child td { border-bottom: none; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 700; padding: 3px 10px;
      border-radius: 999px;
    }
    .badge-ok { background: #064e3b; color: #10b981; }
    .badge-overdue { background: #450a0a; color: #ef4444; }
    .badge-never { background: #1f2937; color: #9ca3af; }
    .ping-url {
      font-family: 'Courier New', monospace;
      font-size: 12px;
      background: #0d1117;
      border: 1px solid #10b981;
      border-radius: 6px;
      padding: 8px 12px;
      color: #10b981;
      word-break: break-all;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .copy-btn {
      background: none; border: 1px solid #10b981; color: #10b981;
      border-radius: 4px; padding: 2px 8px; font-size: 11px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .copy-btn:hover { background: #10b981; color: #fff; }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; }
    .form-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
    label { font-size: 12px; font-weight: 600; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select {
      background: #0d1117; border: 1px solid #374151; border-radius: 8px;
      color: #e2e8f0; padding: 10px 14px; font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: #10b981; }
    .btn-primary {
      background: #10b981; color: #fff; border: none;
      padding: 10px 24px; border-radius: 8px; font-size: 14px;
      font-weight: 700; cursor: pointer; white-space: nowrap; align-self: flex-end;
    }
    .btn-primary:hover { background: #059669; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .empty-state {
      text-align: center; padding: 40px 0; color: #6b7280; font-size: 15px;
    }
    .alert { border-radius: 8px; padding: 14px 18px; font-size: 14px; margin-bottom: 20px; }
    .alert-error { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; }
    .alert-success { background: #064e3b; border: 1px solid #10b981; color: #6ee7b7; }
    #loading { text-align: center; padding: 60px 0; color: #6b7280; }
    .monitor-name { font-weight: 600; color: #f0f0f0; font-size: 15px; }
    .grace-note { font-size: 12px; color: #6b7280; margin-top: 2px; }
    .last-ping { font-size: 12px; color: #9ca3af; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-logo">⏰ CronWatch</div>
    <div class="topbar-sub">Dead man's switch for cron jobs</div>
  </div>

  <div class="container">
    <div id="loading">Loading your dashboard…</div>
    <div id="error-state" style="display:none"></div>
    <div id="dashboard" style="display:none">

      <div class="card">
        <h2>Your Monitors</h2>
        <div id="monitors-list"></div>
      </div>

      <div class="card">
        <h2>Add Monitor</h2>
        <div id="add-msg"></div>
        <div class="form-row">
          <div class="form-group">
            <label for="mon-name">Monitor Name</label>
            <input id="mon-name" type="text" placeholder="e.g. Daily Backup" />
          </div>
          <div class="form-group" style="max-width:160px;">
            <label for="mon-grace">Grace Period (min)</label>
            <select id="mon-grace">
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
              <option value="60" selected>1 hour</option>
              <option value="120">2 hours</option>
              <option value="360">6 hours</option>
              <option value="720">12 hours</option>
              <option value="1440">24 hours</option>
            </select>
          </div>
          <button class="btn-primary" id="add-btn" onclick="addMonitor()">Create Monitor</button>
        </div>
      </div>

    </div>
  </div>

  <img src="https://agent-control-plane-w3m9.onrender.com/api/hit?page=cronwatch-dashboard" width="1" height="1" style="display:none" alt="" />

  <script>
    const API = 'https://agent-control-plane-w3m9.onrender.com';
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';

    function statusBadge(status) {
      if (status === 'ok') return '<span class="badge badge-ok">🟢 OK</span>';
      if (status === 'overdue') return '<span class="badge badge-overdue">🔴 Overdue</span>';
      return '<span class="badge badge-never">⚪ Never pinged</span>';
    }

    function timeAgo(iso) {
      if (!iso) return '—';
      const diff = Date.now() - new Date(iso).getTime();
      const mins = Math.floor(diff / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return `${Math.floor(hrs / 24)}d ago`;
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied ✓';
        setTimeout(() => btn.textContent = 'Copy', 1500);
      }).catch(() => {
        btn.textContent = 'Copy';
      });
    }

    function renderMonitors(monitors) {
      const container = document.getElementById('monitors-list');
      if (!monitors || monitors.length === 0) {
        container.innerHTML = '<div class="empty-state">No monitors yet — add your first monitor below</div>';
        return;
      }
      let html = '<table class="monitor-table"><thead><tr>'
        + '<th>Name</th><th>Status</th><th>Last Ping</th><th>Grace</th><th>Ping URL</th>'
        + '</tr></thead><tbody>';
      for (const m of monitors) {
        const pingUrl = m.ping_url || `${API}/api/cronwatch/ping/${m.pingToken || m.ping_token}`;
        const curlCmd = `curl -fsS ${pingUrl}`;
        html += `<tr>
          <td><div class="monitor-name">${escHtml(m.name)}</div></td>
          <td>${statusBadge(m.status)}</td>
          <td><div class="last-ping">${timeAgo(m.lastPingAt || m.last_ping_at)}</div></td>
          <td><div class="grace-note">${m.graceMinutes || m.grace_minutes} min</div></td>
          <td>
            <div class="ping-url">
              <span style="flex:1;overflow:hidden;text-overflow:ellipsis;">${escHtml(curlCmd)}</span>
              <button class="copy-btn" onclick="copyText(${JSON.stringify(curlCmd)}, this)">Copy</button>
            </div>
          </td>
        </tr>`;
      }
      html += '</tbody></table>';
      container.innerHTML = html;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function loadDashboard() {
      if (!token) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-state').style.display = 'block';
        document.getElementById('error-state').innerHTML =
          '<div class="alert alert-error">Invalid link — check your welcome email for your dashboard URL.</div>';
        return;
      }
      try {
        const res = await fetch(`${API}/api/cronwatch/dashboard?token=${encodeURIComponent(token)}`);
        document.getElementById('loading').style.display = 'none';
        if (res.status === 401) {
          document.getElementById('error-state').style.display = 'block';
          document.getElementById('error-state').innerHTML =
            '<div class="alert alert-error">Invalid link — check your welcome email for your dashboard URL.</div>';
          return;
        }
        if (!res.ok) throw new Error('Server error');
        const data = await res.json();
        document.getElementById('dashboard').style.display = 'block';
        renderMonitors(data.monitors);
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error-state').style.display = 'block';
        document.getElementById('error-state').innerHTML =
          '<div class="alert alert-error">Could not load dashboard. Please try again in a moment.</div>';
      }
    }

    async function addMonitor() {
      const name = document.getElementById('mon-name').value.trim();
      const grace_minutes = parseInt(document.getElementById('mon-grace').value, 10);
      const btn = document.getElementById('add-btn');
      const msg = document.getElementById('add-msg');

      if (!name) { msg.innerHTML = '<div class="alert alert-error">Please enter a monitor name.</div>'; return; }

      btn.disabled = true;
      btn.textContent = 'Creating…';
      msg.innerHTML = '';

      try {
        const res = await fetch(`${API}/api/cronwatch/monitors`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, name, grace_minutes }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) {
          msg.innerHTML = `<div class="alert alert-error">${escHtml(data.error || 'Failed to create monitor.')}</div>`;
        } else {
          msg.innerHTML = '<div class="alert alert-success">Monitor created! Add the ping URL to your cron job.</div>';
          document.getElementById('mon-name').value = '';
          await loadDashboard();
        }
      } catch (e) {
        msg.innerHTML = '<div class="alert alert-error">Network error. Please try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Monitor';
      }
    }

    loadDashboard();
  </script>
</body>
</html>
